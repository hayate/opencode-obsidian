name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/validate_skills.py
      - run: bash tests/test_sdd_scripts.sh
      # The mutation gate's own tests, and a fast check that every mutation's target is in place
      # (the gate itself runs in mutation.yml).
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 -m unittest discover -s tests/mutation -p 'test_*.py' -v
