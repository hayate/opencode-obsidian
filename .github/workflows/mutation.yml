name: mutation

# The mutation gate (tests/mutation/gate.py): every mutation of core/ and adapters/ must be caught by a test,
# except the few declared to survive on a platform. It runs in interleaved shards, sized per
# platform, and only when a pull request touches what it tests (or by hand, from the Actions tab).
on:
  pull_request:
    paths:
      - "core/**"
      - "adapters/**"
      - "tests/core/**"
      - "tests/adapters/**"
      - "tests/mutation/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mutation.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the pull request replaces the run in progress.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        # Each shard must finish well inside the job's limit (60 minutes). Measured on GitHub's
        # runners (PR #4, 2026-09-23, 349 mutations): the slowest macOS shard of three took
        # 20.5 minutes, the slowest Linux shard of two 18. Every shard 1..N of a platform, once,
        # with that N: test_gate.py checks it. Three macOS shards and ci.yml's two macOS jobs
        # fit the five concurrent macOS jobs GitHub allows this plan.
        include:
          - { os: ubuntu-latest, shard: 1, of: 2 }
          - { os: ubuntu-latest, shard: 2, of: 2 }
          - { os: macos-latest, shard: 1, of: 3 }
          - { os: macos-latest, shard: 2, of: 3 }
          - { os: macos-latest, shard: 3, of: 3 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git --version
      - run: python3 -u tests/mutation/gate.py --shard ${{ matrix.shard }}/${{ matrix.of }}
