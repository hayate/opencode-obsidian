name: mutation

# The mutation gate (tests/mutation/gate.py): every mutation of core/ must be caught by a test,
# except the few declared to survive on a platform. It runs in interleaved shards, sized per
# platform, and only when a pull request touches what it tests (or by hand, from the Actions tab).
on:
  pull_request:
    paths:
      - "core/**"
      - "tests/core/**"
      - "tests/mutation/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/mutation.yml"
  workflow_dispatch:

permissions:
  contents: read

# A new push to the pull request replaces the run in progress.
concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        # Each shard is sized to finish in about 40 minutes on a runner twice as slow as the
        # machine measured (the job's limit is 60). macOS, measured on a laptop after every
        # sync-cycle mutation got its pattern (2026-09-22, 226 mutations): the whole gate took
        # 26 minutes as one shard; in three interleaved shards the slowest takes about 15 (one
        # lock mutation that runs five times is 6 of them). Linux, measured on astrolinux before
        # the patterns (22 minutes for 204), which the patterns only shorten: about 11 each in
        # two. Every shard 1..N of a platform, once, with that N: test_gate.py checks it. Three
        # macOS shards and ci.yml's two macOS jobs fit the five concurrent macOS jobs GitHub
        # allows this plan.
        include:
          - { os: ubuntu-latest, shard: 1, of: 2 }
          - { os: ubuntu-latest, shard: 2, of: 2 }
          - { os: macos-latest, shard: 1, of: 3 }
          - { os: macos-latest, shard: 2, of: 3 }
          - { os: macos-latest, shard: 3, of: 3 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git --version
      - run: python3 -u tests/mutation/gate.py --shard ${{ matrix.shard }}/${{ matrix.of }}
